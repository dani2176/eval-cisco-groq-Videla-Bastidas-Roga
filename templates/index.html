<!-- templates/index.html -->

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cisco AI Generator</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

    <h1>Cisco AI Generator</h1>
    <p class="subtitulo">
        Generador Inteligente Cisco IOS con IA
    </p>

    <form method="POST">

        <!-- TIPO -->

        <div>
            <label>Tipo de Configuración</label>

            <select name="tipo" required>

                <option value="">Seleccione una opción</option>

                <option value="vlan"
                    {% if tipo == "vlan" %}selected{% endif %}>
                    VLAN
                </option>

                <option value="ospf"
                    {% if tipo == "ospf" %}selected{% endif %}>
                    OSPF
                </option>

                <option value="subnetting"
                    {% if tipo == "subnetting" %}selected{% endif %}>
                    SUBNETTING
                </option>

                <option value="dhcp"
                    {% if tipo == "dhcp" %}selected{% endif %}>
                    DHCP
                </option>

                <option value="acl"
                    {% if tipo == "acl" %}selected{% endif %}>
                    ACL
                </option>

            </select>
        </div>

        <!-- VLAN -->

        <div class="grid-2">

            <div>
                <label>ID VLAN</label>

                <input
                    type="text"
                    name="vlan"
                    placeholder="10"
                >
            </div>

            <div>
                <label>Nombre VLAN</label>

                <input
                    type="text"
                    name="nombre"
                    placeholder="VENTAS"
                >
            </div>

        </div>

        <!-- PUERTO -->

        <div>
            <label>Puerto</label>

            <input
                type="text"
                name="puerto"
                placeholder="fa0/1"
            >
        </div>

        <!-- OSPF -->

        <div class="grid-2">

            <div>
                <label>Proceso OSPF</label>

                <input
                    type="text"
                    name="proceso"
                    placeholder="1"
                >
            </div>

            <div>
                <label>Red OSPF</label>

                <input
                    type="text"
                    name="red"
                    placeholder="192.168.1.0"
                >
            </div>

        </div>

        <!-- AREA -->

        <div>
            <label>Área OSPF</label>

            <input
                type="text"
                name="area"
                placeholder="0"
            >
        </div>

        <!-- DHCP -->

        <div class="grid-2">

            <div>
                <label>Gateway</label>

                <input
                    type="text"
                    name="gateway"
                    placeholder="192.168.1.1"
                >
            </div>

            <div>
                <label>DNS</label>

                <input
                    type="text"
                    name="dns"
                    placeholder="8.8.8.8"
                >
            </div>

        </div>

        <!-- ACL -->

        <div class="grid-2">

            <div>
                <label>Permitir IP</label>

                <input
                    type="text"
                    name="permitir"
                    placeholder="192.168.1.0"
                >
            </div>

            <div>
                <label>Wildcard</label>

                <input
                    type="text"
                    name="wildcard"
                    placeholder="0.0.0.255"
                >
            </div>

        </div>

        <!-- SUBNETTING -->

        <div>
            <label>Cantidad Subredes</label>

            <input
                type="text"
                name="subredes"
                placeholder="4"
            >
        </div>

        <!-- BOTON -->

        <button type="submit">
            Generar Configuración
        </button>

    </form>

    <!-- RESULTADO -->

    {% if respuesta %}

    <div class="resultado">

        <h2>Configuración Generada</h2>

        <pre>{{ respuesta }}</pre>

    </div>

    {% endif %}

</div>

</body>
</html>
